name: Build Google Play bundle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: '4.7.2'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install matching Godot editor and Android build template
        shell: bash
        run: |
          set -euo pipefail
          release="${GODOT_VERSION}-stable"
          base="https://github.com/godotengine/godot-builds/releases/download/${release}"
          editor="Godot_v${release}_linux.x86_64.zip"
          templates="Godot_v${release}_export_templates.tpz"
          cd "$RUNNER_TEMP"
          curl -fLsS --retry 3 "$base/$editor" -o "$editor"
          curl -fLsS --retry 3 "$base/$templates" -o "$templates"
          curl -fLsS --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          python3 - "$editor" "$templates" "$GODOT_VERSION" <<'PY'
          import hashlib, pathlib, sys, zipfile
          sums={line.split()[-1].lstrip('*'):line.split()[0] for line in pathlib.Path('SHA512-SUMS.txt').read_text().splitlines() if line.strip()}
          for name in sys.argv[1:3]:
              if hashlib.file_digest(open(name,'rb'),'sha512').hexdigest()!=sums.get(name):
                  raise SystemExit('Checksum mismatch: '+name)
          target=pathlib.Path.home()/'.local/share/godot/export_templates'/f'{sys.argv[3]}.stable'
          target.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(sys.argv[2]) as archive:
              for member in archive.namelist():
                  name=pathlib.PurePosixPath(member).name
                  if name in ['android_source.zip','android_release.apk','version.txt']:
                      (target/name).write_bytes(archive.read(member))
          PY
          unzip -q "$editor" -d godot-bin
          chmod +x "godot-bin/Godot_v${release}_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot-bin/Godot_v${release}_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Configure SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'build-tools;36.0.0' 'platforms;android-36'
          mkdir -p "$HOME/.config/godot"
          python3 - <<'PY'
          import os, pathlib, json
          settings='[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          for key,value in {'export/android/android_sdk_path':os.environ['ANDROID_HOME'],'export/android/java_sdk_path':os.environ['JAVA_HOME']}.items():
              settings+=key+' = '+json.dumps(value)+'\n'
          (pathlib.Path.home()/'.config/godot/editor_settings-4.7.tres').write_text(settings)
          PY
      - name: Import and test game
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --editor --import --quit
          for suite in scene rescue animation camera flight; do
            godot --headless --path godot --script "Tests/test_${suite}.gd" 2>&1 | tee "$RUNNER_TEMP/test-${suite}.log"
            if grep -Eq 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/test-${suite}.log"; then exit 1; fi
          done
      - name: Export signed Play bundle
        env:
          UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/airlift-upload.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: airlift-upload
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEYSTORE"
          test -n "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD"
          umask 077
          printf '%s' "$UPLOAD_KEYSTORE" | base64 --decode > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          trap 'rm -f "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"' EXIT
          mkdir -p godot/builds/play
          godot --headless --path godot --install-android-build-template --export-release 'Android Play' builds/play/airlift-play.aab
          jarsigner -verify godot/builds/play/airlift-play.aab | tee godot/builds/play/signature-verification.txt
          grep -q 'jar verified' godot/builds/play/signature-verification.txt
          keytool -printcert -jarfile godot/builds/play/airlift-play.aab > godot/builds/play/signing-certificate.txt
          keytool -exportcert -rfc -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" -alias airlift-upload -storepass:env GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD -file godot/builds/play/upload-certificate.pem
      - name: Validate package and release manifest
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 'https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar' -o "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=godot/builds/play/airlift-play.aab
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=godot/builds/play/airlift-play.aab > godot/builds/play/AndroidManifest.xml
          python3 - <<'PYCODE'
          import pathlib, xml.etree.ElementTree as ET
          root=ET.parse('godot/builds/play/AndroidManifest.xml').getroot()
          android='{http://schemas.android.com/apk/res/android}'
          assert root.attrib['package']=='com.studioeddies.airlift'
          assert root.attrib[android+'versionName']=='0.0.1'
          assert root.find('application').get(android+'debuggable','false')=='false'
          assert any(a.get(android+'screenOrientation') in ['userLandscape','11'] for a in root.findall('./application/activity'))
          print('Verified release bundle: com.studioeddies.airlift, version 0.0.1, landscape, non-debuggable')
          PYCODE
          cd godot/builds/play
          sha256sum airlift-play.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: airlift-google-play
          path: godot/builds/play/
          retention-days: 30
          if-no-files-found: error
