name: Playtest feedback
description: Report a problem while playing Rotorlift.
title: "[Playtest] "
body:
  - type: markdown
    attributes:
      value: Thanks for testing Rotorlift. Reports are public; please leave out personal information.
  - type: input
    id: device
    attributes:
      label: Device and operating system
      placeholder: "Nothing Phone (3a), Android 16; or iPhone model and iOS version"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: How are you playing?
      options:
        - Google Play internal test
        - iPhone TestFlight
        - Downloaded Android APK
        - Browser
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or browser
      placeholder: "0.0.1 (build 1), or Chrome/Safari version"
  - type: input
    id: mission
    attributes:
      label: Mission and assist settings
      placeholder: "Pine Ridge; altitude hold on, tether on, auto-hoist off"
  - type: textarea
    id: reproduce
    attributes:
      label: What happened?
      description: Include the steps, what you expected, and what happened instead. You can attach screenshots or a short recording here.
    validations:
      required: true
